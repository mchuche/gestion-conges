<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Gestionnaire de Congés</title>
    <script type="text/javascript">
      // Hack SPA pour GitHub Pages : rechargement direct sur une route profonde.
      // Avec le site servi à la racine du domaine (ex. domaine perso, `base: /`) : 0 segment à « garder ».
      // Si tu déploies encore sur `https://user.github.io/<repo>/` avec `VITE_BASE_PATH=/<repo>/`,
      // remets ce nombre à 1 (un segment = nom du dépôt).
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
