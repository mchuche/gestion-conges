# Sert le build Vite (base path /gestion-conges/) pour le conteneur "web".
server {
    listen 80;
    server_name localhost;

    # Fichiers statiques sous /gestion-conges/ (dist copié dans ce sous-dossier)
    location /gestion-conges/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /gestion-conges/index.html;
    }

    location = / {
        return 302 /gestion-conges/;
    }
}
