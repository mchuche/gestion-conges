name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # URL publique de l’API Nest (HTTPS recommandé). Le front lit import.meta.env.VITE_API_URL au build.
      - name: Validate secrets
        run: |
          echo "Vérification du secret GitHub..."
          if [ -z "${{ secrets.VITE_API_URL }}" ]; then
            echo "::error::Secret VITE_API_URL manquant (ex. https://api.mondomaine.com)"
            exit 1
          fi
          echo "Secret VITE_API_URL présent."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        run: |
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" >> .env

      # VITE_BASE_PATH : variable dépôt optionnelle (ex. /gestion-conges/ pour github.io/<repo>/)
      - name: Build with Vite
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
